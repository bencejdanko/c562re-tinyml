# OpenOCD configuration for NUCLEO-C562RE (STM32C562RET6 - Cortex-M33 via STLINK-V3)
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# STM32C5 Cortex-M33 SWD DPIDR
set CPUTAPID 0x6ba02477

source [find target/stm32u5x.cfg]

adapter speed 4000

# Disable auto memory map probing for unsupported chip DBGMCU
gdb_memory_map disable
