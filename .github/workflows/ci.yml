name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Host Unit Testing & Code Formatting Verification
  # ---------------------------------------------------------------------------
  host-unit-tests:
    name: Host Unit Tests & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Host Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang-format

      - name: Verify Clang-Format Compliance
        run: |
          cmake -B build/host_test -S tests -G Ninja
          # Check formatting on all project and test source files
          git ls-files "src/*.cpp" "src/*.hpp" "src/*.c" "src/*.h" "tests/*.cpp" "tests/**/*.cpp" | xargs -r clang-format --dry-run --Werror

      - name: Build & Run Pigweed Unit Test Suite (Host x86_64)
        run: |
          cmake -B build/host_test -S tests -G Ninja
          cmake --build build/host_test
          ctest --test-dir build/host_test --output-on-failure

  # ---------------------------------------------------------------------------
  # 2. ARM Cortex-M33 Cross-Compilation Verification
  # ---------------------------------------------------------------------------
  arm-cross-compile:
    name: ARM Cortex-M33 Firmware Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build

      - name: Build Production Firmware (NUCLEO-C562RE)
        run: |
          cmake --preset debug_GCC_NUCLEO-C562RE
          cmake --build --preset debug_GCC_NUCLEO-C562RE

      - name: Build On-Target Test Firmware
        run: |
          cmake --preset target_test_NUCLEO-C562RE
          cmake --build --preset target_test_NUCLEO-C562RE
