[project]
name = "c562re-tinyml-tests"
version = "0.1.0"
description = "Host-side harness for on-target Pigweed tests (reads results over ST-Link UART)"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "pyserial>=3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/target"]
